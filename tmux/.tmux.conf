# Tmux defaults for comfortable mouse/trackpad use in modern terminals.

# Make tmux scrollable with the mouse/trackpad and keep useful history.
set -g mouse on
set -g history-limit 100000

# Keep interactive shells responsive and let terminal focus events through.
set -g escape-time 10
set -g focus-events on

# Keep window and pane numbering predictable for humans.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefer normal Emacs-style copy-mode keys over vi keys.
setw -g mode-keys emacs

# Let tmux integrate with the terminal clipboard when supported.
set -g set-clipboard on

# Mouse wheel enters copy-mode so Ghostty/iTerm2 trackpads can scroll tmux history.
bind -n WheelUpPane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'
bind -n WheelDownPane send-keys -M
bind PageUp copy-mode -eu
bind -n S-PageUp copy-mode -eu

# Friendly defaults that keep new panes/windows in the current directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'

# Easy reload after editing this file.
bind r source-file ~/.tmux.conf \; display-message 'Reloaded ~/.tmux.conf'

# A readable, low-noise status line.
set -g status-interval 5
set -g status-position bottom
set -g status-style 'bg=colour236,fg=colour250'
set -g status-left-length 40
set -g status-left ' #S '
set -g status-right-length 80
set -g status-right ' %Y-%m-%d %H:%M '
setw -g window-status-current-style 'bg=colour33,fg=colour231,bold'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'
set -g message-style 'bg=colour33,fg=colour231'
set -g mode-style 'bg=colour33,fg=colour231'
